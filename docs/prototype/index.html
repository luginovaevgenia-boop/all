<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Общий заказ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: одна колонка до 520px для участницы, до 1040px для организатора; шапка с переключателем ролей, ниже вкладки. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --ink:#16201D; --muted:#566660; --line:#D6DFDA;
  --accent:#0B6E55; --accent-ink:#FFFFFF; --accent-soft:#DDF0E8;
  --warn:#9A4B06; --warn-soft:#FBE7CC;
  --crit:#B3261E; --crit-soft:#FADDD9;
  --info:#1D4E89; --info-soft:#DCE8F7;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(22,32,29,.06),0 6px 18px rgba(22,32,29,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#16211E; --ink:#E6EEEB; --muted:#9AAEA7; --line:#2A3A36;
    --accent:#3FC79F; --accent-ink:#04241A; --accent-soft:#16352C;
    --warn:#F2B766; --warn-soft:#3A2C14;
    --crit:#FF9E96; --crit-soft:#3E1B19;
    --info:#9CC2F2; --info-soft:#172A40;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --ink:#E6EEEB; --muted:#9AAEA7; --line:#2A3A36;
  --accent:#3FC79F; --accent-ink:#04241A; --accent-soft:#16352C;
  --warn:#F2B766; --warn-soft:#3A2C14;
  --crit:#FF9E96; --crit-soft:#3E1B19;
  --info:#9CC2F2; --info-soft:#172A40;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-width:0}
.wrap.wide{max-width:1040px}
.proto{font-size:12px;color:var(--muted);text-align:center;padding:10px 0 0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0 10px}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:2px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px;text-align:center}
.badge.crit{background:var(--crit);color:var(--surface)}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner b{font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.prod{display:grid;grid-template-columns:128px 1fr;min-width:0}
.tile{background:var(--accent-soft) center/cover no-repeat;min-height:120px}
.pbody{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:7px}
.pname{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.art{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);background:var(--bg);border-radius:5px;padding:1px 6px;font-size:12px;white-space:nowrap}
.price{font-family:var(--f-display);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--bg);color:var(--muted)}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mine{font-size:13px;color:var(--accent);font-weight:600}
.vlist{display:grid;gap:2px;font-size:14px;font-variant-numeric:tabular-nums}
.vrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .c{color:var(--muted);font-size:12px}
.vrow.out{color:var(--muted);text-decoration:line-through}
.vrow.out .nov{text-decoration:none;color:var(--crit);font-weight:600;font-size:12px}
/* orders */
.order{padding:14px}
.order .head{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.order .tile{min-height:48px;height:48px;border-radius:10px}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:14px 0 6px}
.steps i{height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.state{font-weight:700}
.alert{background:var(--crit-soft);color:var(--crit);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.alert b{display:block;margin-bottom:2px}
.alert .row{justify-content:flex-start;margin-top:10px}
.alert.wait{background:var(--warn-soft);color:var(--warn)}
.sum{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;margin-bottom:12px}
.sum .big{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet h2{margin:0;font-size:18px;line-height:1.25}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-width:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:left}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.opt:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
label.l{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea.inp{min-height:150px;resize:vertical}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{border:0;background:transparent;width:40px;height:40px;font-size:20px}
.qty output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:60;max-width:calc(100vw - 32px);font-size:14px;box-shadow:var(--shadow)}
/* organizer */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{font-family:var(--f-display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.kpi.crit b{color:var(--crit)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools .inp{width:auto;min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--accent-soft)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--accent-soft);border-radius:12px;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.field{margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.oprod{padding:14px;display:grid;grid-template-columns:72px 1fr;gap:14px;margin-bottom:12px}
.oprod .tile{border-radius:10px;min-height:72px;height:72px}
.ovar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ovar:last-child{border-bottom:0}
.ovar.out .vn{color:var(--muted);text-decoration:line-through}
.preview{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.preview img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:10px}
@media(prefers-reduced-motion:no-preference){.btn,.opt{transition:background .15s,border-color .15s}}
</style>

</head>
<body>
<div class="wrap" id="wrap">
  <div class="proto">Прототип. Имена участниц и количество заказов вымышленные, товары и цены взяты из вашего примера.</div>
  <header class="top">
    <div class="brand">Общий заказ<small>Закупки из Китая · Бишкека · Садовода</small></div>
    <div class="seg" role="group" aria-label="Роль">
      <button id="roleU" aria-pressed="true">Участница</button>
      <button id="roleO" aria-pressed="false">Организатор</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

var role='U', tab='catalog', selected={}, fProd='all', fStatus='all', sheet=null;
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return n.toLocaleString('ru-RU')+' ₽';}
function prod(id){return products.filter(function(p){return p.id===id;})[0];}
function ord(id){return orders.filter(function(o){return o.id===id;})[0];}
function isOpen(p){return p.stop>Date.now();}
function oSum(o){return prod(o.pid).v[o.vi].rub*o.qty;}
function left(p){
  var ms=p.stop-Date.now();
  if(ms<=0) return 'Приём закрыт';
  var d=Math.floor(ms/D), h=Math.floor(ms%D/H), m=Math.floor(ms%H/60e3);
  if(d>=1) return 'до стопа '+d+' д '+h+' ч';
  if(h>=1) return 'до стопа '+h+' ч '+m+' мин';
  return 'до стопа '+m+' мин';
}
function stopLabel(p){
  var d=new Date(p.stop);
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function leftPill(p){
  var ms=p.stop-Date.now();
  return '<span class="pill '+(ms<=0?'mute':(ms<6*H?'warn':'info'))+'">'+left(p)+'</span>';
}
function tile(p){return '<div class="tile" style="background-image:url(\''+p.photo+'\')" role="img" aria-label="Фото: арт. '+esc(p.art)+'"></div>';}
function toast(t){
  var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);
  toast.t=setTimeout(function(){el.hidden=true;},3600);
}
function issueCount(){return orders.filter(function(o){return o.issue==='out';}).length;}

function renderTabs(){
  var t=$('#tabs'), list;
  if(role==='U'){
    var mine=orders.filter(function(o){return o.who===ME;});
    var attn=mine.filter(function(o){return o.issue==='out';}).length;
    list=[['catalog','Каталог'],['orders','Мои заказы'+(attn?'<span class="badge crit">!</span>':(mine.length?'<span class="badge">'+mine.length+'</span>':''))]];
  } else {
    var n=issueCount();
    list=[['o-orders','Заказы'+(n?'<span class="badge crit">'+n+'</span>':'')],['o-prods','Товары и наличие'],['o-new','Новый товар']];
  }
  t.innerHTML=list.map(function(x){return '<button role="tab" data-tab="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'</button>';}).join('');
}

function viewCatalog(){
  var open=products.filter(isOpen).sort(function(a,b){return a.stop-b.stop;});
  var b='';
  if(open.length && open[0].stop-Date.now()<12*H){
    b='<div class="banner"><span aria-hidden="true">⏰</span><span>Скоро стоп: <b>арт. '+esc(open[0].art)+'</b>, '+left(open[0])+'</span></div>';
  }
  var cards=products.slice().sort(function(a,b){return (isOpen(b)-isOpen(a))||(a.stop-b.stop);}).map(function(p){
    var mine=orders.filter(function(o){return o.who===ME&&o.pid===p.id;});
    var m=mine.length?'<div class="mine">✓ Ваш заказ: '+mine.map(function(o){return esc(p.v[o.vi].l)+', р-р '+esc(o.ring)+' × '+o.qty;}).join('; ')+'</div>':'';
    var vl=p.v.map(function(v){
      return '<div class="vrow'+(v.out?' out':'')+'"><span>'+esc(v.l)+'</span><span class="c">¥'+v.cny+'</span><span>'+(v.out?'<span class="nov">нет в наличии</span>':'<b>'+money(v.rub)+'</b>')+'</span></div>';
    }).join('');
    var anyIn=p.v.some(function(v){return !v.out;});
    return '<article class="card prod">'+tile(p)+'<div class="pbody"><div class="row"><span class="art">Арт. '+esc(p.art)+'</span>'+leftPill(p)+'</div>'+
      '<div class="pname">'+esc(p.name)+'</div><div class="vlist">'+vl+'</div>'+
      '<div class="meta">'+(isOpen(p)?'Стоп '+stopLabel(p):'')+'</div>'+m+
      '<div><button class="btn sm" data-order="'+p.id+'"'+((isOpen(p)&&anyIn)?'':' disabled')+'>'+(isOpen(p)?(anyIn?'Заказать':'Всё разобрали'):'Приём закрыт')+'</button></div></div></article>';
  }).join('');
  return b+'<div class="grid">'+cards+'</div><p class="hint">Цена без доставки. Карго до вашего города считается после приёмки на складе.</p>';
}

function stepper(o){
  var s='';
  for(var i=0;i<7;i++) s+='<i class="'+(i<o.status?'on':(i===o.status?'now':''))+'"></i>';
  return '<div class="steps" aria-hidden="true">'+s+'</div>';
}
function viewOrders(){
  var mine=orders.filter(function(o){return o.who===ME;}).sort(function(a,b){return b.at-a.at;});
  if(!mine.length) return '<div class="card empty">Пока нет заказов.<br>Выберите товар в каталоге.</div>';
  var live=mine.filter(function(o){return o.status===0&&o.issue!=='out';});
  var due=live.reduce(function(s,o){return s+oSum(o);},0);
  var allClosed=live.every(function(o){return !isOpen(prod(o.pid));});
  var head='<div class="card sum"><div><div class="meta">К оплате</div><div class="big">'+money(due)+'</div></div>'+
    '<span class="pill '+(due?(allClosed?'warn':'info'):'ok')+'">'+(due?(allClosed?'Можно оплатить':'Оплата после стопа'):'Нечего оплачивать')+'</span></div>';
  var cards=mine.map(function(o){
    var p=prod(o.pid), v=p.v[o.vi];
    var canEdit=o.status===0&&isOpen(p)&&!o.issue, canPay=o.status===0&&!isOpen(p)&&!o.issue;
    var alert='';
    if(o.issue==='out'){
      alert='<div class="alert"><b>Этого варианта нет в наличии</b>Организатор сообщил, что «'+esc(v.l)+'» не удалось купить. Что сделать с заказом?'+
        '<div class="row"><button class="btn sm" data-replace="'+o.id+'">Заменить</button><button class="btn sec sm" data-wait="'+o.id+'">Подождать</button><button class="btn danger sm" data-cancel="'+o.id+'">Отменить</button></div></div>';
    } else if(o.issue==='wait'){
      alert='<div class="alert wait"><b>Вы ждёте поступления</b>Как только вариант появится, придёт уведомление. Заказ сохранён.'+
        '<div class="row"><button class="btn sec sm" data-replace="'+o.id+'">Заменить</button><button class="btn danger sm" data-cancel="'+o.id+'">Отменить</button></div></div>';
    }
    return '<article class="card order"><div class="head">'+tile(p)+
      '<div style="min-width:0"><div class="pname" style="font-size:15px">'+esc(p.name)+' <span class="art">Арт. '+esc(p.art)+'</span></div><div class="meta">'+esc(v.l)+' · р-р '+esc(o.ring)+' × '+o.qty+'</div></div>'+
      '<div class="price" style="font-size:15px">'+money(oSum(o))+'</div></div>'+stepper(o)+
      '<div class="state">'+(o.status+1)+' из 7 · '+STATUSES[o.status]+'</div><div class="meta">'+HINTS[o.status]+'</div>'+
      (o.comment?'<div class="meta">Комментарий: '+esc(o.comment)+'</div>':'')+alert+
      ((canEdit||canPay)?'<div class="row" style="margin-top:12px;justify-content:flex-start">'+
        (canPay?'<button class="btn sm" data-pay="'+o.id+'">Я оплатила</button>':'<span class="meta">Можно отменить до '+stopLabel(p)+'</span>')+
        (canEdit?'<button class="btn sec sm" data-cancel="'+o.id+'">Отменить</button>':'')+'</div>':'')+
      '</article>';
  }).join('');
  return head+'<div class="grid">'+cards+'</div>';
}

function statusPill(o){
  if(o.issue==='out') return '<span class="pill crit">Нет в наличии · ждём ответ</span>';
  if(o.issue==='wait') return '<span class="pill warn">Ждёт поступления</span>';
  return '<span class="pill '+(o.status===0?'warn':(o.status===6?'ok':'info'))+'">'+STATUSES[o.status]+'</span>';
}
function matchFilter(o){
  if(fProd!=='all'&&String(o.pid)!==fProd) return false;
  if(fStatus==='all') return true;
  if(fStatus==='issue') return !!o.issue;
  return !o.issue&&String(o.status)===fStatus;
}
function viewOOrders(){
  var rows=orders.filter(matchFilter).sort(function(a,b){return b.at-a.at;});
  var total=orders.filter(function(o){return o.issue!=='out';}).reduce(function(s,o){return s+oSum(o);},0);
  var unpaid=orders.filter(function(o){return o.status===0&&o.issue!=='out';}).reduce(function(s,o){return s+oSum(o);},0);
  var ic=issueCount();
  var kp='<div class="kpis"><div class="card kpi"><span>Заказов</span><b>'+orders.length+'</b></div>'+
    '<div class="card kpi"><span>Сумма заказов</span><b>'+money(total)+'</b></div>'+
    '<div class="card kpi"><span>Ждёт оплаты</span><b>'+money(unpaid)+'</b></div>'+
    '<div class="card kpi'+(ic?' crit':'')+'"><span>Нет в наличии, ждём ответ</span><b>'+ic+'</b></div></div>';
  var selN=Object.keys(selected).length;
  var tools='<div class="tools"><select class="inp" id="fProd" aria-label="Товар"><option value="all">Все артикулы</option>'+
    products.map(function(p){return '<option value="'+p.id+'"'+(fProd===String(p.id)?' selected':'')+'>Арт. '+esc(p.art)+'</option>';}).join('')+'</select>'+
    '<select class="inp" id="fStatus" aria-label="Статус"><option value="all">Все статусы</option><option value="issue"'+(fStatus==='issue'?' selected':'')+'>Проблемные (нет в наличии)</option>'+
    STATUSES.map(function(s,i){return '<option value="'+i+'"'+(fStatus===String(i)?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
    '<span style="flex:1"></span><button class="btn sec sm" id="copyTsv">Скопировать для таблицы</button></div>';
  var bulk=selN?'<div class="bulk"><b>Выбрано: '+selN+'</b><select class="inp" id="bulkStatus" aria-label="Новый статус">'+
    STATUSES.map(function(s,i){return '<option value="'+i+'">'+s+'</option>';}).join('')+'</select><button class="btn sm" id="bulkApply">Применить и уведомить</button></div>':'';
  var allSel=rows.length&&rows.every(function(o){return selected[o.id];});
  var body=rows.map(function(o){
    var p=prod(o.pid);
    return '<tr class="'+(selected[o.id]?'sel':'')+'"><td><input type="checkbox" data-sel="'+o.id+'"'+(selected[o.id]?' checked':'')+' aria-label="Выбрать заказ"></td>'+
      '<td>'+esc(o.who)+'</td><td><span class="art">'+esc(p.art)+'</span> '+esc(p.v[o.vi].l)+'</td><td>'+esc(o.ring)+'</td><td class="n">'+o.qty+'</td>'+
      '<td class="n">'+money(oSum(o))+'</td><td>'+statusPill(o)+'</td></tr>';
  }).join('');
  return kp+tools+bulk+'<div class="card tablewrap"><table><thead><tr><th><input type="checkbox" id="selAll" aria-label="Выбрать все"'+(allSel?' checked':'')+'></th><th>Участница</th><th>Арт. и вариант</th><th>Размер кольца</th><th class="n">Шт.</th><th class="n">Сумма</th><th>Статус</th></tr></thead><tbody>'+(body||'<tr><td colspan="7" class="empty">Нет заказов по фильтру</td></tr>')+'</tbody></table></div>'+
    '<p class="hint">Заказы попадают сюда сами, как только участница нажала «Заказать». Переносить из чата ничего не нужно.</p>';
}

function viewOProds(){
  return products.slice().sort(function(a,b){return b.stop-a.stop;}).map(function(p){
    var vr=p.v.map(function(v,i){
      var n=orders.filter(function(o){return o.pid===p.id&&o.vi===i;}).reduce(function(s,o){return s+o.qty;},0);
      return '<div class="ovar'+(v.out?' out':'')+'"><span class="vn">'+esc(v.l)+' · ¥'+v.cny+' · '+money(v.rub)+'</span><span class="meta">заказано '+n+'</span>'+
        '<button class="btn sm '+(v.out?'sec':'danger')+'" data-vout="'+p.id+':'+i+'">'+(v.out?'Вернуть в наличие':'Нет в наличии')+'</button></div>';
    }).join('');
    return '<div class="card oprod">'+tile(p)+'<div style="min-width:0"><div class="row"><div class="pname">Арт. '+esc(p.art)+' · '+esc(p.name)+'</div>'+leftPill(p)+'</div>'+
      '<div class="meta" style="margin-bottom:8px">Стоп: '+stopLabel(p)+'</div>'+vr+
      '<div class="row" style="margin-top:10px;justify-content:flex-start">'+(isOpen(p)?'<button class="btn sec sm" data-ext="'+p.id+'">+1 день</button><button class="btn sec sm" data-close="'+p.id+'">Закрыть приём</button>':'<button class="btn sec sm" data-reopen="'+p.id+'">Открыть на сутки</button>')+'</div></div></div>';
  }).join('')+'<p class="hint">Если вариант не удалось купить, нажмите «Нет в наличии». Участницы с такими заказами получат уведомление и выберут сами: замену, ожидание или отмену. Писать каждой в личку не нужно.</p>';
}

var SAMPLE='Арт: 122\n107ю - 1500₽ (0.5 карат)\n125ю - 1750₽ (1 карат)\n161ю - 2255₽ (2 карата)\n192ю - 2690₽ (3 карата)\n\nАрт: 115\n107ю - 1500₽ (0.5 карата)\n121ю - 1695₽ (1 карат)\n165ю - 2310₽ (2 карата)\n199ю - 2790₽ (3 карата)\n255ю - 3570₽ (5 карат)';
var draft={text:SAMPLE,name:'Кольцо с камнем',days:3,items:null,photo:IMG.full};
function round5(n){return Math.round(n/5)*5;}
function parseText(tx){
  var parts=tx.split(/Арт[:.\s]+(?=\d)/i), items=[];
  for(var i=1;i<parts.length;i++){
    var art=(parts[i].match(/^\s*(\d+)/)||[])[1]; if(!art) continue;
    var v=[], re=/(\d+)\s*ю[а-я]*\.?\s*[-–—:]\s*([\d\s]*?)\s*(?:₽|руб|р\b)?\s*\(([^)\n]+)\)/gi, m;
    var body=parts[i].replace(/^\s*\d+/,'');
    while((m=re.exec(body))){
      var cny=+m[1], rub=m[2].replace(/\s/g,'')?+m[2].replace(/\s/g,''):round5(cny*RATE);
      var l=m[3].trim().replace('.',',').replace(/^0,5 карат$/,'0,5 карата');
      v.push(V(l,cny,rub));
    }
    if(v.length) items.push({art:art,v:v});
  }
  return items;
}
function viewONew(){
  var pv='';
  if(draft.items){
    pv=draft.items.map(function(it){
      return '<div class="preview"><b>Арт. '+esc(it.art)+'</b><div class="vlist">'+it.v.map(function(v){return '<div class="vrow"><span>'+esc(v.l)+'</span><span class="c">¥'+v.cny+'</span><b>'+money(v.rub)+'</b></div>';}).join('')+'</div></div>';
    }).join('');
  }
  return '<div class="two"><div class="card" style="padding:16px">'+
    '<div class="field"><label class="l" for="dPhoto">Фото (одно на все артикулы в посте)</label><div class="preview"><img id="dImg" alt="Фото товара" src="'+draft.photo+'"><input class="inp" type="file" id="dPhoto" accept="image/*"></div></div>'+
    '<div class="field"><label class="l" for="dText">Текст поста, как вы пишете в чат</label><textarea class="inp" id="dText">'+esc(draft.text)+'</textarea>'+
    '<div class="hint">Здесь ваш настоящий пример. В прототипе разбор простой, в рабочей версии его делает ИИ. Если цены в рублях нет, считаем по курсу '+RATE+' ₽ за ¥.</div></div>'+
    '<button class="btn" id="parse">Распознать</button></div>'+
    '<div class="card" style="padding:16px"><div class="field"><label class="l" for="dName">Название</label><input class="inp" id="dName" value="'+esc(draft.name)+'"></div>'+
    '<div class="field"><label class="l" for="dDays">Стоп через (дней)</label><select class="inp" id="dDays">'+[1,2,3,4,5,7].map(function(d){return '<option'+(draft.days===d?' selected':'')+'>'+d+'</option>';}).join('')+'</select></div>'+
    (draft.items?'<label class="l">Найдено артикулов: '+draft.items.length+'</label>'+pv:'<div class="meta" style="margin-bottom:12px">Нажмите «Распознать», и здесь появятся артикулы с вариантами и ценами.</div>')+
    '<button class="btn" id="publish"'+(draft.items?'':' disabled')+'>Опубликовать в каталог</button></div></div>';
}

function render(){
  document.getElementById('wrap').className='wrap'+(role==='O'?' wide':'');
  $('#roleU').setAttribute('aria-pressed',role==='U');$('#roleO').setAttribute('aria-pressed',role==='O');
  renderTabs();
  $('#view').innerHTML={catalog:viewCatalog,orders:viewOrders,'o-orders':viewOOrders,'o-prods':viewOProds,'o-new':viewONew}[tab]();
}

function openSheet(id){var p=prod(id);sheet={mode:'new',p:p,vi:null,ring:null,qty:1,comment:''};drawSheet();}
function openReplace(oId){var o=ord(oId);sheet={mode:'replace',o:o,p:prod(o.pid),vi:null,ring:o.ring,qty:o.qty,comment:''};drawSheet();}
function drawSheet(){
  var s=sheet,p=s.p,rep=s.mode==='replace';
  var vs=p.v.map(function(v,i){
    var cur=rep&&i===s.o.vi;
    return '<button class="opt" data-var="'+i+'" aria-pressed="'+(s.vi===i)+'"'+((v.out||cur)?' disabled':'')+'>'+esc(v.l)+'<small>'+(v.out?'нет в наличии':(cur?'текущий':money(v.rub)))+'</small></button>';
  }).join('');
  var total=s.vi!==null?p.v[s.vi].rub*s.qty:0;
  var diff='';
  if(rep&&s.vi!==null){var d=total-oSum(s.o);diff='<div class="meta">'+(d===0?'Цена та же':(d>0?'Доплатить '+money(d):'Вернём '+money(-d)))+'</div>';}
  $('#layer').innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">'+
    '<div><span class="art">Арт. '+esc(p.art)+'</span><h2 id="sh" style="margin-top:6px">'+(rep?'Заменить на другой вариант':esc(p.name))+'</h2>'+(rep?'':'<div class="meta">'+left(p)+'</div>')+'</div>'+
    '<div><label class="l">'+(rep?'Новый вариант':'Вариант')+'</label><div class="opts">'+vs+'</div></div>'+
    (rep?'':'<div><label class="l">Размер кольца</label><div class="opts">'+RINGS.map(function(z){return '<button class="opt" data-ring="'+z+'" aria-pressed="'+(s.ring===z)+'">'+z+'</button>';}).join('')+'</div></div>'+
    '<div><label class="l">Количество</label><div class="qty"><button data-q="-1" aria-label="Меньше">−</button><output>'+s.qty+'</output><button data-q="1" aria-label="Больше">+</button></div></div>'+
    '<div><label class="l" for="sc">Комментарий организатору (необязательно)</label><input class="inp" id="sc" value="'+esc(s.comment)+'" placeholder="Например: платина, если есть"></div>')+
    '<div class="row"><div><div class="price">'+(total?money(total):'—')+'</div>'+diff+'</div><div class="row"><button class="btn sec" data-x="1">Отмена</button><button class="btn" id="confirm"'+((s.vi!==null&&s.ring)?'':' disabled')+'>'+(rep?'Заменить':'Заказать')+'</button></div></div></div></div>';
}
function closeSheet(){sheet=null;$('#layer').innerHTML='';}

document.addEventListener('click',function(e){
  var t=e.target.closest('button,input[type=checkbox]');
  if(!t){ if(e.target.id==='scrim')closeSheet(); return; }
  var d=t.dataset;
  if(t.id==='roleU'){role='U';tab='catalog';closeSheet();render();return;}
  if(t.id==='roleO'){role='O';tab='o-orders';closeSheet();render();return;}
  if(d.tab){tab=d.tab;render();return;}
  if(d.order){openSheet(+d.order);return;}
  if(d.replace){openReplace(+d.replace);return;}
  if(sheet&&d.var!==undefined){sheet.vi=+d.var;drawSheet();return;}
  if(sheet&&d.ring){sheet.ring=d.ring;drawSheet();return;}
  if(sheet&&d.q){sheet.qty=Math.max(1,Math.min(20,sheet.qty+ +d.q));drawSheet();return;}
  if(d.x){closeSheet();return;}
  if(t.id==='confirm'&&sheet){
    var p=sheet.p;
    if(sheet.mode==='replace'){
      sheet.o.vi=sheet.vi;sheet.o.issue=null;
      toast('Заказ заменён: '+p.v[sheet.vi].l+'. Организатор увидит это в таблице.');
    } else {
      addOrder(ME,p.id,sheet.vi,sheet.ring,sheet.qty,0,0);
      var last=orders[orders.length-1];last.comment=sheet.comment.trim();
      toast('Заказ принят: арт. '+p.art+', '+p.v[sheet.vi].l+', р-р '+sheet.ring+'. Он уже в таблице организатора.');
    }
    closeSheet();render();return;
  }
  if(d.cancel){
    var oc=ord(+d.cancel);var paid=oc.status>=1;
    orders=orders.filter(function(o){return o.id!==oc.id;});
    toast(paid?'Заказ отменён. Оплату вернём, организатор увидит возврат в списке.':'Заказ отменён');render();return;
  }
  if(d.wait){ord(+d.wait).issue='wait';toast('Хорошо, заказ сохранён. Сообщим, когда вариант появится.');render();return;}
  if(d.pay){ord(+d.pay).status=1;toast('Оплата отмечена. Организатор получит уведомление.');render();return;}
  if(d.sel){if(t.checked)selected[d.sel]=1;else delete selected[d.sel];render();return;}
  if(t.id==='selAll'){
    orders.filter(matchFilter).forEach(function(o){if(t.checked)selected[o.id]=1;else delete selected[o.id];});render();return;
  }
  if(t.id==='bulkApply'){
    var st=+$('#bulkStatus').value, n=0, who={};
    orders.forEach(function(o){if(selected[o.id]){o.status=st;o.issue=null;n++;who[o.who]=1;}});
    selected={};toast('Статус «'+STATUSES[st]+'» у '+n+' поз. Уведомления получат: '+Object.keys(who).length+' уч.');render();return;
  }
  if(t.id==='copyTsv'){
    var tsv=['Участница\tАрт.\tВариант\tРазмер кольца\tШт.\tСумма, ₽\tСтатус'].concat(orders.map(function(o){var p=prod(o.pid);return [o.who,p.art,p.v[o.vi].l,o.ring,o.qty,oSum(o),o.issue==='out'?'Нет в наличии':(o.issue==='wait'?'Ждёт поступления':STATUSES[o.status])].join('\t');})).join('\n');
    var ok=function(){toast('Скопировано. Вставьте в Google Таблицу или Excel.');};
    var fail=function(){toast('Не удалось скопировать. В рабочей версии таблица выгружается автоматически.');};
    try{navigator.clipboard.writeText(tsv).then(ok,fail);}catch(err){fail();}
    return;
  }
  if(d.vout){
    var a=d.vout.split(':'),pp=prod(+a[0]),vv=pp.v[+a[1]],n2=0;
    vv.out=!vv.out;
    orders.forEach(function(o){
      if(o.pid!==pp.id||o.vi!==+a[1]) return;
      if(vv.out&&o.status<2&&!o.issue){o.issue='out';n2++;}
      if(!vv.out&&o.issue){o.issue=null;n2++;}
    });
    toast(vv.out?('Вариант «'+vv.l+'» отмечен как закончившийся. Уведомлены участниц: '+n2+'. Они выберут замену, ожидание или отмену.'):('Вариант «'+vv.l+'» снова в наличии. Участницы с этим заказом получат уведомление.'));
    render();return;
  }
  if(d.ext){prod(+d.ext).stop+=D;render();return;}
  if(d.close){prod(+d.close).stop=Date.now();toast('Приём по товару закрыт');render();return;}
  if(d.reopen){prod(+d.reopen).stop=Date.now()+D;toast('Приём открыт на сутки');render();return;}
  if(t.id==='parse'){
    draft.text=$('#dText').value;draft.name=$('#dName').value;draft.days=+$('#dDays').value;
    draft.items=parseText(draft.text);
    if(!draft.items.length){draft.items=null;toast('Не нашёл артикулов. Формат: «Арт: 122» и строки «107ю - 1500₽ (0.5 карат)».');}
    else toast('Распознано артикулов: '+draft.items.length+'. Проверьте и опубликуйте.');
    render();return;
  }
  if(t.id==='publish'){
    if(!draft.items) return;
    var nm=$('#dName').value.trim()||'Товар', days=+$('#dDays').value;
    draft.items.forEach(function(it){
      products.push({id:nextId++,art:it.art,name:nm,photo:draft.photo,stop:Date.now()+days*D,v:it.v});
    });
    var cnt=draft.items.length;
    draft={text:'',name:'Кольцо с камнем',days:3,items:null,photo:IMG.full};
    toast('Опубликовано артикулов: '+cnt+'. Они уже в каталоге у участниц.');tab='o-prods';render();return;
  }
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='fProd'){fProd=e.target.value;render();}
  if(id==='fStatus'){fStatus=e.target.value;render();}
  if(id==='dPhoto'&&e.target.files&&e.target.files[0]){
    var r=new FileReader();
    r.onload=function(){draft.photo=r.result;draft.text=$('#dText').value;draft.name=$('#dName').value;render();};
    r.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='sc'&&sheet)sheet.comment=e.target.value;
  if(e.target.id==='dText')draft.text=e.target.value;
  if(e.target.id==='dName')draft.name=e.target.value;
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet)closeSheet();});
setInterval(function(){var a=document.activeElement&&document.activeElement.tagName;if(!sheet&&a!=='TEXTAREA'&&a!=='INPUT'&&a!=='SELECT'&&tab!=='o-new')render();},30000);
render();
})();
</script>
